name: Postqube image
# Every commit on `postqube` is tested, built once and published as
#   ghcr.io/<owner>/postqube:sha-<commit>   (immutable)
#   ghcr.io/<owner>/postqube:staging        (moving; the staging deployer follows it)
# Production never rebuilds: postqube-release.yml retags an already-tested sha image.
on:
  push:
    branches: [postqube]
  workflow_dispatch:
concurrency:
  group: postqube-image-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
  packages: write
env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/postqube
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Free hosted runner disk for the upstream image
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Regression tests (must pass before anything is published)
        run: docker buildx build --target native-test --output type=cacheonly -f postqube/native/Dockerfile .
      - name: Build and push runtime image
        run: |
          docker buildx build --target dist -f postqube/native/Dockerfile \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            --label org.opencontainers.image.licenses=AGPL-3.0 \
            -t "$IMAGE:sha-${{ github.sha }}" -t "$IMAGE:staging" --push .
      - name: Summary
        run: |
          echo "Published \`$IMAGE:sha-${{ github.sha }}\` and moved \`:staging\`." >> "$GITHUB_STEP_SUMMARY"
          echo "The staging deployer on the server picks it up within ~5 minutes." >> "$GITHUB_STEP_SUMMARY"
