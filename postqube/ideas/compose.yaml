services:
  ideas:
    image: node:22.23.4-bookworm-slim
    container_name: postqube-ideas
    user: "1000:1000"
    restart: unless-stopped
    init: true
    working_dir: /app
    command: [node, server.mjs]
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL to the public Postqube origin}
      POSTIZ_INTERNAL_URL: http://postiz:5000
      DATA_DIR: /data
      NODE_ENV: production
    ports: ["127.0.0.1:4018:4018"]
    volumes:
      - ./:/app:ro
      - ${IDEAS_DATA_DIR:-/var/lib/postqube-ideas}:/data
    read_only: true
    tmpfs: ["/tmp:size=16m,noexec,nosuid"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 64
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4018/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [postiz]
networks:
  postiz:
    external: true
    name: ${POSTIZ_NETWORK:-postiz_postiz-network}
